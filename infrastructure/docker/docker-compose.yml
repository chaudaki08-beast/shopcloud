version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: shopcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub:
    image: google/cloud-sdk:emulators
    container_name: shopcloud-pubsub
    restart: unless-stopped
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=shopcloud-dev
    ports:
      - "8085:8085"

volumes:
  postgres_data:
