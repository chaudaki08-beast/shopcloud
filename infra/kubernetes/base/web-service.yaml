apiVersion: v1
kind: Service
metadata:
  name: shopcloud-web
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: shopcloud-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shopcloud-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
