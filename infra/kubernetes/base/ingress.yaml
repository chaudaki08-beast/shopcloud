apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopcloud-ingress
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-ingress
    app.kubernetes.io/part-of: shopcloud-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shopcloud-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopcloud-web
                port:
                  number: 80
