apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopcloud-api
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopcloud-platform
    app.kubernetes.io/version: "1.7.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shopcloud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopcloud-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: shopcloud-platform
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/project-c3f386b1-6c37-468d-8ee/shopcloud/api:v1.7.0-phase17
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: NODE_ENV
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: GCP_PROJECT_ID
            - name: GCP_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: GCP_STORAGE_BUCKET
            - name: PUBSUB_TOPIC_ORDERS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: PUBSUB_TOPIC_ORDERS
            - name: PUBSUB_TOPIC_PAYMENTS
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: PUBSUB_TOPIC_PAYMENTS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: CORS_ORIGIN
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: JWT_REFRESH_SECRET
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: RAZORPAY_KEY_ID
                  optional: true
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: RAZORPAY_KEY_SECRET
                  optional: true
            - name: RAZORPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: RAZORPAY_WEBHOOK_SECRET
                  optional: true
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopcloud-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
