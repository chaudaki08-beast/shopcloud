apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopcloud-web
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: shopcloud-platform
    app.kubernetes.io/version: "1.7.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shopcloud-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopcloud-web
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: shopcloud-platform
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: asia-south1-docker.pkg.dev/project-c3f386b1-6c37-468d-8ee/shopcloud/web:v1.7.0-phase17
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: shopcloud-config
                  key: API_UPSTREAM
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
