apiVersion: v1
kind: ResourceQuota
metadata:
  name: shopcloud-quota
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud
    app.kubernetes.io/part-of: shopcloud-platform
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
    services: "10"
