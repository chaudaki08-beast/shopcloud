apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopcloud-web-hpa
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-web
    app.kubernetes.io/part-of: shopcloud-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopcloud-web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
