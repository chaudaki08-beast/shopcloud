apiVersion: v1
kind: LimitRange
metadata:
  name: shopcloud-limits
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud
    app.kubernetes.io/part-of: shopcloud-platform
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 10m
        memory: 16Mi
