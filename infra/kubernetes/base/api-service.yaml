apiVersion: v1
kind: Service
metadata:
  name: shopcloud-api
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: shopcloud-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shopcloud-api
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
