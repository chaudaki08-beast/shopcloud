apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopcloud

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - inventory-worker-deployment.yaml
  - notification-worker-deployment.yaml
  - ingress.yaml
  - hpa-api.yaml
  - hpa-web.yaml
  - pdb-api.yaml
  - pdb-web.yaml
  - resource-quota.yaml
  - limit-range.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: shopcloud-platform
      app.kubernetes.io/managed-by: kustomize
