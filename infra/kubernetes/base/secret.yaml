apiVersion: v1
kind: Secret
metadata:
  name: shopcloud-secrets
  namespace: shopcloud
  labels:
    app.kubernetes.io/name: shopcloud
    app.kubernetes.io/part-of: shopcloud-platform
  annotations:
    description: "Template secret for ShopCloud. In production/GKE, values are populated via Secret Manager or Workload Identity."
type: Opaque
stringData:
  # NOTE: These are non-sensitive template placeholders for schema and static dry-run validation.
  # Real secrets MUST NEVER be committed to version control.
  DATABASE_URL: "postgresql://placeholder_user:placeholder_pass@127.0.0.1:5432/shopcloud_db?schema=public"
  JWT_ACCESS_SECRET: "placeholder-jwt-access-secret-minimum-32-chars-long"
  JWT_REFRESH_SECRET: "placeholder-jwt-refresh-secret-minimum-32-chars-long"
  RAZORPAY_KEY_ID: "rzp_test_placeholder"
  RAZORPAY_KEY_SECRET: "placeholder_key_secret"
  RAZORPAY_WEBHOOK_SECRET: "placeholder_webhook_secret"
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
