name: Build & Push Images

# Builds the Cloud Run images and pushes them to Artifact Registry through Workload Identity Federation
# (no keys). It does NOT deploy: Cloud Run deployment is manual in Phase 7; Phase 12 automates it.
# Runs on manual dispatch, and when this file changes (so a branch can produce images before it is on main).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: asia-south1-docker.pkg.dev
  REPOSITORY: asia-south1-docker.pkg.dev/project-c3f386b1-6c37-468d-8ee/shopcloud

jobs:
  build:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: web
            dockerfile: Dockerfile.web
          # worker: deferred until Pub/Sub push delivery exists (Phase 10)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/24903284190/locations/global/workloadIdentityPools/shopcloud-github-pool/providers/github-actions
          service_account: shopcloud-github-deployer@project-c3f386b1-6c37-468d-8ee.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1200s

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "list=${REPOSITORY}/${{ matrix.service }}:phase7-${short_sha},${REPOSITORY}/${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.dockerfile }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record image digest
        run: |
          image="${REPOSITORY}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"
          echo "Pushed ${image}"
          {
            echo "### ${{ matrix.service }}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- tags: \`${{ steps.tags.outputs.list }}\`"
            echo "- digest: \`${image}\`"
          } >> "$GITHUB_STEP_SUMMARY"
